name: Task 4 - Secrets and Variables

on:
  workflow_dispatch:

jobs:
  print-values:
    runs-on: windows-latest

    steps:
      - name: Print repository variable
        run: echo APP_NAME is ${{ vars.APP_NAME }}

      - name: Print secret length
        run: echo API_KEY length is ${{ secrets.API_KEY && secrets.API_KEY.length }}
