name: Test saas-cd variable

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch variable from saas-cd
        env:
          GH_TOKEN: ${{ secrets.SAAS_CD_TOKEN }}
        run: |
          A=$(gh api \
            repos/YOUR_ORG/saas-cd/actions/variables/a \
            --jq '.value')

          echo "Variable A = $A"
